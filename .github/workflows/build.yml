name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from build.gradle
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROJECT_NAME="AllClear"
          mv app/build/outputs/apk/debug/app-debug.apk "${PROJECT_NAME}-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllClear-${{ steps.version.outputs.version }}
          path: AllClear-${{ steps.version.outputs.version }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create source archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROJECT_NAME="AllClear"
          git archive --format=zip --prefix="${PROJECT_NAME}-${VERSION}-source/" HEAD -o "${PROJECT_NAME}-${VERSION}-source.zip"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllClear-${{ steps.version.outputs.version }}-source
          path: AllClear-${{ steps.version.outputs.version }}-source.zip
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
